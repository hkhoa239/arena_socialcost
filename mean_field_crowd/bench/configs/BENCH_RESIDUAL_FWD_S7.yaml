resume: false
agent_config:
  name: BENCH_RESIDUAL_FWD_S7
  action_space:
    type: differential_drive
    linear_range:
    - 0.0
    - 0.5
    angular_range:
    - -1.5
    - 1.5
    normalized: true
  action_chunk: 1
  mirror: none
  framework:
    name: stable_baselines3
    algorithm:
      type: PPO
      architecture_name: AGENT_MF_RESIDUAL
      checkpoint: last_model
      parameters:
        batch_size: 32
        clip_range: 0.2
        clip_range_vf: null
        device: cuda
        ent_coef: 0.0
        gae_lambda: 0.95
        gamma: 0.99
        learning_rate:
          type: linear
          kwargs:
            initial_value: 0.001
            final_value: 0.0001
        max_grad_norm: 0.5
        n_epochs: 5
        n_steps: null
        normalize_advantage: true
        sde_sample_freq: -1
        seed: 7
        total_timesteps: 100000
        stats_window_size: 100
        target_kl: 1.0
        tensorboard_log: null
        total_batch_size: 512
        use_sde: false
        verbose: 2
        vf_coef: 0.22
      transfer_weights: null
    normalization: null
  parameters:
    normalize: true
    normalizer: max_abs
  reward:
    reward_unit_kwargs: null
    verbose: 1
    reward_function_dict:
      goal_reached:
        reward: 20
        _follow_subgoal: false
      safe_distance:
        reward: -0.1
      factored_safe_distance:
        factor: -0.2
      approach_goal:
        pos_factor: 0.3
        neg_factor: 0.4
        _goal_update_threshold: 0.25
        _follow_subgoal: false
        _on_safe_dist_violation: true
      collision:
        reward: -15
arena_cfg:
  general:
    debug_mode: false
    goal_radius: 0.5
    max_num_moves_per_eps: 600
    n_envs: 2
    n_timesteps: 100000
    no_gpu: false
    safety_distance: 1.0
    show_progress_bar: false
    control_hz: 10.0
    env_seed: 7
    env_launch_args:
    - - human:=arena
      - humansim.local_planner:=pedvo
  logging:
    default_level: INFO
    overrides:
      rosnav_rl.observations: WARNING
      rosnav_rl.reward: WARNING
      rosnav_rl.spaces: WARNING
    ros_level: WARNING
    ros_overrides: {}
  task:
    tm_modules: staged
    tm_obstacles: random
    tm_robots: random
    staged:
      starting_stage: 0
      threshold_type: succ
      upper_threshold: 1.01
      lower_threshold: 0.0
      parameter_node_template: /arena/env_{i}/task_generator_node
      timeout: 5.0
      curriculum_definition:
      - task.random.static.n:
        - 0
        - 0
        task.random.dynamic.n:
        - 0
        - 0
        task.random.static.models: []
        task.random.dynamic.models: []
        task.episode.goto_pose.tolerance.radius: 1.0
      - task.random.static.n:
        - 2
        - 4
        task.random.dynamic.n:
        - 0
        - 0
        task.random.static.models: &id001
        - Hospital/SM_Chair_01a
        - Hospital/SM_BedSideTable_01b
        task.random.dynamic.models: []
        task.episode.goto_pose.tolerance.radius: 1.0
      - task.random.static.n:
        - 2
        - 4
        task.random.dynamic.n:
        - 3
        - 5
        task.random.static.models: *id001
        task.random.dynamic.models: &id002
        - Common/Human/arenian
        task.episode.goto_pose.tolerance.radius: 1.0
      - task.random.static.n:
        - 3
        - 5
        task.random.dynamic.n:
        - 10
        - 15
        task.random.static.models:
        - Hospital/SM_Chair_01a
        - Hospital/SM_BedSideTable_01b
        - Hospital/SM_TrashCan
        task.random.dynamic.models: *id002
        task.episode.goto_pose.tolerance.radius: 1.0
      mixture_weights:
      - 0.25
      - 0.25
      - 0.35
      - 0.15
      mixture_seed: 7
  monitoring:
    wandb:
      enabled: false
      project_name: Arena-RL
      group: null
      run_name: null
      tags: null
    episode_logging:
      last_n_episodes: 25
      record_actions: true
    eval_metrics: false
    training_metrics: true
  callbacks:
    periodic_evaluation:
      eval_freq: 10000000
      max_num_moves_per_eps: 1200
      n_eval_episodes: 20
    stop_training_on_threshold: null
    checkpoint_ticks:
    - 20000
    - 40000
    - 60000
    - 80000
    action_stats: true
  profiling: null
